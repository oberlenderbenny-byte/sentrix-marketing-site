<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .post{
    width:700px;height:700px;
    background:radial-gradient(circle at 22% 18%,#12233a 0%,#040a14 62%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    box-sizing:border-box;position:relative;overflow:hidden;
  }
  .glow{
    position:absolute;bottom:-90px;left:-65px;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(250,199,117,0.18),transparent 70%);
  }
  .logo{width:136px;height:136px;margin-bottom:12px;position:relative;z-index:2;}
  .word{font-size:42px;font-weight:800;letter-spacing:4px;color:#fff;position:relative;z-index:2;}
  .tag{
    font-size:16px;color:#fac775;font-weight:700;letter-spacing:1px;
    margin-top:14px;text-align:center;position:relative;z-index:2;
  }
  .sub{
    font-size:14px;color:#c8d8e8;margin-top:12px;max-width:440px;text-align:center;
    line-height:1.5;position:relative;z-index:2;
  }
  .badge{
    margin-top:28px;display:flex;align-items:center;gap:10px;
    border:1px solid rgba(250,199,117,0.5);border-radius:999px;
    padding:8px 18px;position:relative;z-index:2;
  }
  .badge span{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fac775;}
</style>
</head>
<body>
  <div class="post">
    <div class="glow"></div>
    <img class="logo" src="/images/logo-mark.png" />
    <div class="word">SENTRIX</div>
    <div class="tag">AI-verified physical security</div>
    <div class="sub">No security expert needed to deploy it — a built-in engine recommends your sensors, before you buy anything.</div>
    <div class="badge"><span>Now live</span></div>
  </div>
</body>
</html>
